name: Windows Portable Release

on: push

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Build Windows portable package
        shell: pwsh
        run: .\build_portable.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## ZYWtool v1.0.8

          ### What's new
          - Visual naming pipeline with dynamic custom variables, JSON-path sources, variable dependencies, split/extract, ordered transforms and editable steps.
          - Text transforms include replace/remove, trim, whitespace normalization, case conversion, prefixes and suffixes.
          - Time transforms support Unix timestamps and ISO values, IANA timezone conversion (WIB/WITA/WIT or custom zones), and configurable output formats.
          - Multi-record filename preview supports JSON arrays and shows per-record failures before Arrange.
          - Naming variable and transform controls support enable/disable, reorder, edit, remove and reset.
          - Export the built-in Default (Legacy Workflow) preset or selected presets; import portable .zywpreset.json files without overwriting local data/output paths.
          - Existing naming templates, field mappings, No Shift behavior, scan, audit, Arrange/Undo, Preview, Hand Check, background jobs and Excel workflows remain compatible.

          ### Portable and permissions
          - Bundled Python runtime and application libraries.
          - Extract and run ZYWtool/ZYWtool.exe; no Python, pip or dependency installation required.
          - Executable requests asInvoker; administrator elevation is not required.
          - Portable ZIP contains no installer that attempts machine-wide prerequisite installation.

          ### Validation
          - CI compile and regression suite.
          - Windows portable build and ZIP integrity check.
          - GUI Preferences smoke test.
          '@
          gh release create "v1.0.8" ".\release\ZYWtool-Windows-Portable.zip" --title "ZYWtool v1.0.8 - Windows Portable" --notes $notes
