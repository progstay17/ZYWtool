name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Compile
        run: python -m compileall -q handcheck.py handreport.py jobs.py preview_frames.py zywtool.py zyw_core.py undo_arrange.py
      - name: Regression tests
        run: python -m pytest tests -q
      - name: Lint recorder-discovery tests
        run: ruff check tests/test_recorder_discovery.py
