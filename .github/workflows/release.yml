name: Windows Portable Release

on: push

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Build Windows portable package
        shell: pwsh
        run: .\build_portable.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## ZYWtool v1.0.7

          ### What's new
          - GUI-first Preferences for shift schedules, operational defaults, activity aliases, Hand Check and configurable folder naming.
          - 24-hour selectable Shift Manager with add/remove/reorder, overlap validation and overnight support.
          - Explicit No Shift mode; the folder-name template omits the SESSION token entirely (never `S0`).
          - Existing v1.0.5 operational settings migrate into the Default (Legacy Workflow) preset.
          - Built-in presets: Default (Legacy Workflow), No Shift, Morning Shift and Full Day Operations.
          - JSON editor is hidden in Developer Mode.
          - New Naming Convention tab: browse and scan a sample `session.json`, detect nested JSON fields and array values, map fields, customize token order/separators, and preview folder names live.
          - Naming templates and JSON field mappings are saved in Preferences and custom presets.
          - Existing scan, audit, explorer, Arrange/Undo, Preview, Hand Check, background jobs and Excel workflows remain available.

          ### Portable and permissions
          - Bundled Python runtime and application libraries.
          - Extract and run ZYWtool/ZYWtool.exe; no Python, pip or dependency installation required.
          - Executable requests asInvoker; administrator elevation is not required.
          - Portable ZIP contains no installer that attempts machine-wide prerequisite installation.

          ### Validation
          - CI compile and regression suite.
          - Windows portable build and ZIP integrity check.
          - GUI Preferences smoke test.
          '@
          gh release create "v1.0.7" ".\release\ZYWtool-Windows-Portable.zip" --title "ZYWtool v1.0.7 - Windows Portable" --notes $notes
